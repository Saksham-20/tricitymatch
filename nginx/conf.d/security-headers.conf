# Additional security headers for production
# Included by nginx.conf via `include /etc/nginx/conf.d/*.conf;`

# Content Security Policy for the static SPA.
#
# The backend's helmet CSP only covers API responses; the HTML shell served by
# nginx had no policy at all, which is the surface that actually matters for
# XSS. This is now enabled and kept in sync with backend/middlewares/security.js
# — change both together.
#
# Verified in a real browser against a production build before enabling: all 5
# font families load, the SPA renders, and /login and /about produce zero
# console errors. The previous commented-out draft was stale and would have
# broken things if pasted in: it had NO font-src (so every Google Font would
# have fallen back to Georgia — the exact bug hit in the 2026-08-17 prod audit)
# and was missing checkout.razorpay.com from connect-src/img-src.
#
# script-src has NO 'unsafe-inline': the service-worker registration was moved
# out of an inline <script> in index.html into src/main.jsx specifically so this
# could stay strict. Keep index.html free of inline executable script.
#
# img-src/media-src must include api.cloudinary.com: private media (selfies,
# voice notes, video intros) is served as a signed Cloudinary *download* URL
# from that host (utils/privateMedia.js), not res.cloudinary.com. Without it the
# admin verification queue shows "Image unavailable" for every selfie.
#
# frame-src must include checkout.razorpay.com — the hosted checkout renders in
# an iframe from that host (F-025).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https://api.cloudinary.com https://checkout.razorpay.com; media-src 'self' blob: https://res.cloudinary.com https://api.cloudinary.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com https://checkout.razorpay.com wss://tricitymatch.com https://accounts.google.com/gsi/; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Permissions Policy
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
