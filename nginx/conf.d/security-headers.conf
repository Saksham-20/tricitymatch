# Additional security headers for production
# Included by nginx.conf via `include /etc/nginx/conf.d/*.conf;`

# Content Security Policy — tighten before launch
# NOTE: frame-src must include checkout.razorpay.com (the hosted checkout renders in an
# iframe from that host) — F-025 fixed this in the backend helmet config; keeping the
# commented header in sync so uncommenting it can never resurrect the bug.
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' wss://tricitymatch.com; frame-src https://api.razorpay.com https://checkout.razorpay.com;" always;

# Permissions Policy
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
