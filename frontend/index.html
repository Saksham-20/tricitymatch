<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Primary Meta Tags -->
    <title>TricityMatch - Find Your Perfect Match in Tricity</title>
    <!-- Per-route <title>, description, canonical and og/twitter title/url are set
         by the <Seo> component (react-helmet-async). Only route-invariant defaults
         live here. -->
    <meta name="keywords" content="matrimony, tricity, chandigarh, mohali, panchkula, marriage, matchmaking, life partner" />
    <meta name="author" content="TricityMatch" />
    <meta name="robots" content="index, follow" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#8B2346" />
    <meta name="msapplication-TileColor" content="#B30021" />
    
    <!-- Favicons.
         ?v= is a cache-buster, not decoration: Chrome keeps favicons in a store
         separate from the HTTP cache, so a rebranded icon at the SAME url keeps
         showing the old mark through hard reloads. Bump v on every mark change. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json?v=2" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TricityMatch" />
    
    <!-- Open Graph / Facebook (static defaults so non-JS social crawlers get a
         complete preview; <Seo> overrides title/url/description/image per route) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TricityMatch" />
    <meta property="og:title" content="TricityMatch - Find Your Perfect Match in Tricity" />
    <meta property="og:description" content="The most trusted matrimonial platform for Chandigarh, Mohali, and Panchkula. Photo-verified, human-reviewed profiles." />
    <meta property="og:url" content="https://tricitymatch.com/" />
    <meta property="og:image" content="https://tricitymatch.com/images/og-card.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TricityMatch — Tricity's own matrimonial community" />

    <!-- Twitter (name=, not property= — the card is only read from name-scoped tags) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TricityMatch - Find Your Perfect Match in Tricity" />
    <meta name="twitter:description" content="The most trusted matrimonial platform for Chandigarh, Mohali, and Panchkula. Photo-verified, human-reviewed profiles." />
    <meta name="twitter:image" content="https://tricitymatch.com/images/og-card.png?v=2" />
    <meta name="twitter:image:alt" content="TricityMatch — Tricity's own matrimonial community" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    
    <!-- DNS Prefetch (preconnect for fonts.googleapis/gstatic already declared above) -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    
    <!--
      Fonts — ONE request for every family the app uses, here in the document
      head where the preload scanner finds it before any JS runs.

      The four display families used to be loaded by a runtime `@import` inside
      a <style> tag rendered by Home.jsx. That stylesheet could not be
      discovered until React had mounted and rendered, so on throttled 4G the
      request did not even START until ~1970ms — after which Google returns CSS
      that then points at fonts.gstatic.com for the actual files. Three
      sequential round trips before the landing page's headline font existed.
      Measured with scripts/lcp-probe.mjs; do not move these back into a
      component.
    -->
    <!-- Plain render-blocking stylesheet, NOT the media="print"+onload async trick.
         That trick needs an inline `onload` handler to flip media print→all, and the
         site CSP (script-src 'self' …, no unsafe-hashes) blocks inline event handlers
         — so onload never fired, the link stayed media="print", and every Google font
         (Playfair, Inter, Instrument Serif, Cormorant) failed to load on screen for
         100% of visitors: headings fell back to Georgia/serif. A blocking link is
         preload-scanner-discoverable here in <head>; every family is display=swap so
         text still paints in fallback and swaps in; preconnect above offsets the block.
         Do NOT reintroduce media="print"+onload while the CSP forbids inline handlers. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    
    <!-- Inline critical CSS for faster first paint -->
    <style>
      /* Critical CSS for initial render */
      *,*::before,*::after{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%;line-height:1.5}
      body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif}
      #root{min-height:100vh}
      .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FDF8F2}
      .loading-spinner{width:48px;height:48px;border:4px solid #EAD9C8;border-top-color:#7C1D3A;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>

    <!-- Structured data (SEO): Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "TricityMatch",
          "url": "https://tricitymatch.com/",
          "logo": "https://tricitymatch.com/icons/apple-touch-icon.png",
          "description": "Hyperlocal matrimonial platform for Chandigarh, Mohali and Panchkula. Photo-verified, human-reviewed profiles.",
          "areaServed": ["Chandigarh", "Mohali", "Panchkula"],
          "sameAs": [
            "https://www.instagram.com/tricitymatch",
            "https://www.facebook.com/tricitymatch"
          ]
        },
        {
          "@type": "WebSite",
          "name": "TricityMatch",
          "url": "https://tricitymatch.com/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://tricitymatch.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- No-JS fallback -->
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif">
        <h1>JavaScript Required</h1>
        <p>TricityMatch requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    
    <!-- App container with loading state -->
    <div id="root">
      <div class="loading-screen">
        <div class="loading-spinner"></div>
      </div>
    </div>
    
    <!-- Main application script -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service worker registration lives in src/main.jsx, NOT in an inline
         <script>. An inline script forces script-src 'unsafe-inline' in the
         Content-Security-Policy, which gives away most of the protection the
         policy exists for. Keep this file free of inline executable script. -->
  </body>
</html>
